<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
<style>
        /* Estilos Globais */
        body {
            font-family: 'Arial', sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container do Formulário */
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        /* Título */
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        /* Inputs */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #5c6bc0;
            outline: none;
            box-shadow: 0 0 5px rgba(92, 107, 192, 0.7);
        }

        /* Botão */
        button {
            background-color: #5c6bc0;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #3f4c8c;
        }

        /* Mensagens exibidas */
        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }

        .result div {
            margin-top: 10px;
            background-color: #e3f2fd;
            padding: 8px;
            border-radius: 5px;
            color: #1976d2;
        }
    </style>
</style>
<script>
function processamento()
{
    const nome = document.getElementById("nome").value.trim()
    const email = document.getElementById("email").value.trim()
    if (nome === "" && email === "")
    {
        alert("Por favor, preencha corretamente os campos")
        return
    }
    if (nome === "") 
    {
        alert("Por favor, preencha corretamente o campo nome")
        return
    }
    if (email === ""){
        alert("Por favor, preencha corretamente o campo email")
        return
    }
    document.getElementById("nomecadastrado").innerHTML = nome
    document.getElementById("emailcadastrado").innerHTML = email
}

</script>


</head>
<body>
    <input id="nome" type="text" placeholder="Insira seu nome">
    <input id="email" type="text" placeholder="Insira seu e-mail">
    <div id="nomecadastrado"></div>
    <div id="emailcadastrado"></div>
    <button id="botaocadastro" onclick="processamento()">Entrar</button>
</body>
</html>
